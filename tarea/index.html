<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tarea Semana 8</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 640px; margin: 30px auto; }
        section { border: 1px solid #ccc; padding: 12px; margin-bottom: 16px; }
    </style>
</head>

<body>

    <h1 id="titulo">Registro de notas de estudiantes</h1>

    <section>
        <form id="formulario-notas">
            <input type="text" id="curso" placeholder="Curso">
            <input type="text" id="nombre" placeholder="Nombre del estudiante">
            <input type="number" id="nota" placeholder="Nota">
            <button type="submit">Agregar</button>
        </form>
    </section>

    <section>
        <h2 id="subtitulo">Formulario:</h2>
        <ul id="lista-notas"></ul>
    </section>

    <script src="app.js"></script>

</body>

</html>
